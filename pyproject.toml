[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloop"
version = "0.1.0"
description = "A command-line coding agent built from scratch, with no agent framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "google-genai>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentloop = "agentloop.cli:app"

[tool.setuptools.packages.find]
include = ["agentloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
